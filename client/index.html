<!doctype html>
<html lang="en" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Public-dir assets use Vite's base-URL placeholder (substituted at build
         time, always trailing-slashed) rather than a root-absolute "/": the
         GitHub Pages build is served from a subpath, where "/favicon.svg"
         404s. Vite rewrites the module entry below, but not these. -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <!-- PWA: add-to-home-screen over Tailscale (issues #28/#77, docs/mobile.md).
         Assets live in client/public/ so the production build ships them too. -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#24b47e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Customizable DCA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
