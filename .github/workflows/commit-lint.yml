name: commit-lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  commit-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Self-test the checker
        run: node scripts/ci/commit-lint.mjs --self-test
      - name: Lint PR commits
        run: node scripts/ci/commit-lint.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
