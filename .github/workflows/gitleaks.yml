name: gitleaks

on:
  push:
    branches: [main]
  pull_request:

# The action lists PR commits via the API, hence pull-requests: read.
permissions:
  contents: read
  pull-requests: read

jobs:
  # Secret scan over the full history. Free for personal-account repos
  # (organization repos would need GITLEAKS_LICENSE).
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
